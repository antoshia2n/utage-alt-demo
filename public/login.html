<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c4d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<title>ログイン｜シアラボ</title>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="brand" href="/">シアラボ</a></header>
  <main style="padding:24px 0 8px">
    <h1 style="font-size:26px">ログイン</h1>
    <p class="note">登録したメールアドレスに、ログイン用のリンクを送ります。パスワードは要りません。</p>
    <form id="f" class="card stack" novalidate>
      <div><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" required></div>
      <button class="btn block" id="go" type="submit">ログイン用のリンクを送る</button>
      <div id="msg" class="msg hidden" role="status"></div>
    </form>
    <!-- 便 8g-1：ホーム画面に足したシアラボでは、メールのリンクがこの画面ではなく Safari で開き、ログインがホーム画面のシアラボに残らない。
         そのときはメールの確認コードでここから入る -->
    <form id="cf" class="card stack hidden" novalidate style="margin-top:12px">
      <div><label for="code">メールの確認コード（ホーム画面のシアラボから入るとき）</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="6 桁の数字"></div>
      <button class="btn block ghost" id="code-go" type="submit">確認コードで入る</button>
      <div id="cmsg" class="msg hidden" role="status"></div>
    </form>
    <p class="note">まだ登録していない方は <a href="/register">無料登録</a> へ。</p>
  </main>
</div>
<footer class="site wrap">
  <a href="/legal/tokushoho">特定商取引法に基づく表記</a><a href="/legal/privacy">プライバシーポリシー</a>
  <div style="margin-top:8px">© シアラボ（株式会社Best Life Consulting）</div>
</footer>
<script type="module">
  import { getClient } from "/js/common.js";
  const $ = (id) => document.getElementById(id);
  const show = (text, ok) => { const m = $("msg"); m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); };
  getClient().then(async (sb) => { const { data } = await sb.auth.getSession(); if (data.session) location.replace("/app"); }).catch(() => {});
  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("email").value.trim();
    if (!email) return show("メールアドレスを入れてください。", false);
    $("go").disabled = true;
    try {
      const sb = await getClient();
      // 台帳にいてログインの番号がまだ無い人（ポータル時代の会員）は、先に番号を作ってからリンクを送る
      await fetch("/api/login/prepare", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email }) }).catch(() => {});
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + "/app", shouldCreateUser: false } });
      if (error) throw new Error(/not found|signups not allowed/i.test(error.message) ? "このメールアドレスはまだ登録されていません。" : "送れませんでした：" + error.message);
      show(email + " にログイン用のリンクを送りました。ホーム画面のシアラボから入るときは、メールにある確認コードを下に入れてください。", true);
      $("cf").classList.remove("hidden");
    } catch (err) { show(err.message, false); $("go").disabled = false; }
  });
  $("cf").addEventListener("submit", async (e) => {
    e.preventDefault();
    const m = $("cmsg");
    const say = (text, ok) => { m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); };
    const email = $("email").value.trim(), token = $("code").value.replace(/\s/g, "");
    if (!email || !/^[0-9]{6,10}$/.test(token)) return say("メールアドレスと、メールにある数字の確認コードを入れてください。", false);
    $("code-go").disabled = true;
    try {
      const sb = await getClient();
      const { error } = await sb.auth.verifyOtp({ email, token, type: "email" });
      if (error) throw new Error("確認コードが合いませんでした。メールをもう一度確かめるか、リンクを送り直してください。");
      location.replace("/app?fresh=1");
    } catch (err) { say(err.message, false); $("code-go").disabled = false; }
  });
</script>
</body>
</html>
